<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="g-spot-tl" cx="0.12" cy="0.0" r="0.6">
      <stop offset="0%" stop-color="#c4c9d1" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#c4c9d1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g-spot-br" cx="0.92" cy="1" r="0.6">
      <stop offset="0%" stop-color="#7c818b" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#7c818b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g-base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0b0d"/>
      <stop offset="100%" stop-color="#050506"/>
    </linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#c4c9d1" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <pattern id="thinlines" width="2" height="2" patternUnits="userSpaceOnUse">
      <path d="M 0 0 L 2 0" fill="none" stroke="#c4c9d1" stroke-opacity="0.03"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#g-base)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  <rect width="100%" height="100%" fill="url(#thinlines)"/>
  <rect width="100%" height="100%" fill="url(#g-spot-tl)"/>
  <rect width="100%" height="100%" fill="url(#g-spot-br)"/>
  <!-- Decorative ornamental frame -->
  <g stroke="#b7bcc4" stroke-opacity="0.07" fill="none" stroke-width="1.5">
    <rect x="40" y="40" width="1840" height="1000" rx="8"/>
    <rect x="56" y="56" width="1808" height="968" rx="6" stroke-dasharray="3 5"/>
    <rect x="72" y="72" width="1776" height="936" rx="4"/>
  </g>
</svg>
