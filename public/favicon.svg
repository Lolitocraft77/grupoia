<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="fav-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0b0d"/>
      <stop offset="100%" stop-color="#050506"/>
    </linearGradient>
    <linearGradient id="fav-silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4f6f8"/>
      <stop offset="50%" stop-color="#c4c9d1"/>
      <stop offset="100%" stop-color="#7c818b"/>
    </linearGradient>
    <mask id="fav-crescent">
      <circle cx="32" cy="32" r="20" fill="white"/>
      <circle cx="39" cy="28" r="17" fill="black"/>
    </mask>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="url(#fav-bg)" stroke="#7c818b" stroke-width="1.5"/>
  <rect width="64" height="64" fill="url(#fav-silver)" mask="url(#fav-crescent)"/>
</svg>
