<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Group I.A">
  <defs>
    <!-- Gold metallic (135deg): dark → gold → light highlight → gold → dark -->
    <linearGradient id="gia-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8A6D1B"/>
      <stop offset="35%" stop-color="#C9A227"/>
      <stop offset="50%" stop-color="#F4E4A6"/>
      <stop offset="65%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#8A6D1B"/>
    </linearGradient>
    <!-- Chrome metallic core -->
    <linearGradient id="gia-chrome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6E6E73"/>
      <stop offset="40%" stop-color="#B8B8BD"/>
      <stop offset="50%" stop-color="#F0F0F2"/>
      <stop offset="60%" stop-color="#B8B8BD"/>
      <stop offset="100%" stop-color="#6E6E73"/>
    </linearGradient>
    <radialGradient id="gia-coreglow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0%" stop-color="#F0F0F2"/>
      <stop offset="55%" stop-color="#B8B8BD"/>
      <stop offset="100%" stop-color="#3a3a40"/>
    </radialGradient>
  </defs>

  <!-- Circuit traces radiating to nodes (gold, faint) -->
  <g stroke="url(#gia-gold)" stroke-width="1.4" fill="url(#gia-gold)" opacity="0.85">
    <path d="M60 8 V2" fill="none"/><circle cx="60" cy="2" r="2.2"/>
    <path d="M60 112 V118" fill="none"/><circle cx="60" cy="118" r="2.2"/>
    <path d="M8 60 H2" fill="none"/><circle cx="2" cy="60" r="2.2"/>
    <path d="M112 60 H118" fill="none"/><circle cx="118" cy="60" r="2.2"/>
    <path d="M24 24 L14 14" fill="none"/><circle cx="14" cy="14" r="2"/>
    <path d="M96 24 L106 14" fill="none"/><circle cx="106" cy="14" r="2"/>
    <path d="M24 96 L14 106" fill="none"/><circle cx="14" cy="106" r="2"/>
    <path d="M96 96 L106 106" fill="none"/><circle cx="106" cy="106" r="2"/>
  </g>

  <!-- Diamond: gold border + chrome core -->
  <polygon points="60,8 112,60 60,112 8,60" fill="none" stroke="url(#gia-gold)" stroke-width="6" stroke-linejoin="round"/>
  <polygon points="60,22 98,60 60,98 22,60" fill="url(#gia-coreglow)" stroke="url(#gia-chrome)" stroke-width="2"/>

  <!-- Inner engraved diamond line (gold, faint) -->
  <polygon points="60,34 86,60 60,86 34,60" fill="none" stroke="url(#gia-gold)" stroke-width="1.2" opacity="0.55"/>
</svg>
